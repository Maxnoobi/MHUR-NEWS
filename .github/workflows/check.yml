name: Revisar novedades MHUR

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhur-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Revisar novedades
        run: python monitor.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Guardar estado
        run: |
          git config user.name "mhur-monitor"
          git config user.email "mhur-monitor@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Actualizar estado" && git push)
